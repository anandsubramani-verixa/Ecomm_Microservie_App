# version: '3.8'

services:
  # SQL Server for transactional data
  ecommerce-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AzureThink82#"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - ecommerce-network

  # Azure Service Bus Emulator (for local development)
  ecommerce-servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: ecommerce-servicebus
    ports:
      - "5672:5672"  # AMQP
      - "5300:5300"  # HTTP management
    environment:
      ACCEPT_EULA: "Y"   # ✅ required to launch emulator
      SQL_SERVER: ecommerce-sql
      MSSQL_SA_PASSWORD: "AzureThink82#"
    depends_on:
      - ecommerce-sql
    networks:
      - ecommerce-network

  # Cosmos DB Emulator
  ecommerce-cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: ecommerce-cosmos
    ports:
      - "8081:8081"   # HTTPS
      - "10250-10255:10250-10255"  # TCP
    environment:
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    networks:
      - ecommerce-network

  # Redis for caching
  ecommerce-redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: src/ProductService/ProductService.API/Dockerfile
    container_name: product-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=ecommerce-sql;Database=ProductDb;User=sa;Password=AzureThink82#;TrustServerCertificate=true"
      - "ServiceBus__ConnectionString=Endpoint=sb://ecommerce-servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE"
    ports:
      - "5001:8080"
    depends_on:
      - ecommerce-sql
      - ecommerce-servicebus
    networks:
      - ecommerce-network

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: src/OrderService/OrderService.API/Dockerfile
    container_name: order-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=ecommerce-sql;Database=OrderDb;User=sa;Password=AzureThink82#;TrustServerCertificate=true"
      - "ServiceBus__ConnectionString=Endpoint=sb://ecommerce-servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE"
    ports:
      - "5002:8080"
    depends_on:
      - ecommerce-sql
      - ecommerce-servicebus
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  sql-data:
